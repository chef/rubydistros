---
# Adhoc Buildkite pipeline for validating Dockerfile/dobi.yaml changes on a
# PR branch. Mirrors the docker/build pipeline (same dobi.yaml targets,
# same DOCKER_API_VERSION pin) but stops after `build`, skipping the `push`
# step so nothing is uploaded to Docker Hub. Point a manually-triggered
# Buildkite pipeline at this file to run it against a PR branch.
env:
  IMAGE_REGISTRY: rubydistros
  # ponytail: dobi's bundled Docker client defaults to API 1.25; agents
  # running Docker Engine 29+ require >=1.44 and reject it. Pin the client
  # version like build.docker.yml already does.
  DOCKER_API_VERSION: "1.44"

steps:
  - label: ":docker: adhoc build (no push) all rubydistros linux images"
    command: |
      set -euo pipefail
      for target in $(grep -oE '^image=[A-Za-z0-9_-]+' dobi.yaml | cut -d= -f2 | grep -v windows); do
        echo "--- building ${target}"
        dobi "${target}=build"
      done
